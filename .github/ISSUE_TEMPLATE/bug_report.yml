name: Ошибка
description: Что сломалось и как это повторить
title: "[Ошибка] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте ключи, .env, auth.json и необработанные личные логи."
  - type: input
    id: version
    attributes:
      label: Версия программы и Windows
      placeholder: "Например: 7.2.1, Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как повторить
      description: Последовательность действий перед сбоем
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительные сведения
      description: Только просмотренный отчёт со скрытыми ключами и личными данными
