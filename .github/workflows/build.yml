name: Сборка Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - shell: powershell
        run: ./build_exe.ps1 -PythonExecutable python
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codex-hybrid-control-windows
          path: dist/*.exe
